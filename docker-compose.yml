version: '3.8'

# ==============================================================================
# Serveur Matrix Synapse — Docker Compose
# ==============================================================================
# Services :
#   synapse  — Homeserver Matrix (matrixdotorg/synapse)
#   postgres — Base de données PostgreSQL 16
#   nginx    — Reverse proxy + terminaison TLS
#   certbot  — Gestion des certificats Let's Encrypt
# ==============================================================================

services:

  # ── Synapse ─────────────────────────────────────────────────────────────────
  synapse:
    image: matrixdotorg/synapse:latest
    container_name: matrix-synapse
    restart: unless-stopped
    environment:
      - SYNAPSE_CONFIG_PATH=/data/homeserver.yaml
    volumes:
      - ./data/synapse:/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - matrix-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fSs http://localhost:8008/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: matrix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synapse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-synapse}
      # Encodage requis par Synapse
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synapse}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - matrix-net

  # ── Nginx ────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: matrix-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"     # Port HTTP (8090 en local, 80 en production)
      - "${HTTPS_PORT:-443}:443"  # Port HTTPS (ignoré en mode local)
      - "${FED_PORT:-8448}:8448" # Port de fédération Matrix
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    networks:
      - matrix-net

  # ── Certbot ──────────────────────────────────────────────────────────────────
  # Utilisé manuellement par setup.sh pour l'obtention initiale du certificat.
  # Pour le renouvellement : make renew-certs  (ou cron, voir README)
  certbot:
    image: certbot/certbot
    container_name: matrix-certbot
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot

networks:
  matrix-net:
    driver: bridge
