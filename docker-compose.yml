# ==============================================================================
# Serveur Matrix Synapse — Docker Compose
# ==============================================================================
# Services :
#   synapse  — Homeserver Matrix (matrixdotorg/synapse)
#   postgres — Base de données PostgreSQL 16
#   nginx    — Reverse proxy local (profil `local` uniquement)
#   certbot  — Gestion SSL locale (profil `local` uniquement)
# ==============================================================================

services:

  # ── Synapse ─────────────────────────────────────────────────────────────────
  synapse:
    image: matrixdotorg/synapse:latest
    container_name: matrix-synapse
    restart: unless-stopped
    environment:
      - SYNAPSE_CONFIG_PATH=/data/homeserver.yaml
    volumes:
      - ./data/synapse:/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - matrix-net
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # ── Routeur client (port 443) ──
      - "traefik.http.routers.matrix.rule=Host(`${MATRIX_DOMAIN}`)"
      - "traefik.http.routers.matrix.entrypoints=websecure"
      - "traefik.http.routers.matrix.tls=true"
      - "traefik.http.routers.matrix.tls.certresolver=le"
      - "traefik.http.services.matrix.loadbalancer.server.port=8008"
    healthcheck:
      test: ["CMD-SHELL", "curl -fSs http://localhost:8008/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    expose:
      - "8008"

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: matrix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synapse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-synapse}
      # Encodage requis par Synapse
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synapse}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - matrix-net

  # ── Nginx ────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: matrix-nginx
    profiles: ["local"]
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"     # Port HTTP (8090 en local, 80 en production)
      - "${HTTPS_PORT:-443}:443"  # Port HTTPS (ignoré en mode local)
      - "${FED_PORT:-8448}:8448" # Port de fédération Matrix
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    networks:
      - matrix-net

  # ── Certbot ──────────────────────────────────────────────────────────────────
  # Utilisé manuellement par setup.sh pour l'obtention initiale du certificat.
  # Pour le renouvellement : make renew-certs  (ou cron, voir README)
  certbot:
    image: certbot/certbot
    container_name: matrix-certbot
    profiles: ["local"]
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
  # ── LiveKit Server (SFU pour Element Call) ──────────────────────────────────
  livekit:
    image: livekit/livekit-server:latest
    container_name: matrix-livekit
    profiles: ["calls"]
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./data/livekit/livekit.yaml:/etc/livekit.yaml:ro
    networks:
      - matrix-net
    ports:
      # UDP pour le trafic WebRTC média
      - "7882:7882/udp"

  # ── LiveKit JWT Service (auth pour Element Call) ─────────────────────
  lk-jwt-service:
    image: ghcr.io/element-hq/lk-jwt-service:latest
    container_name: matrix-lk-jwt
    profiles: ["calls"]
    restart: unless-stopped
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:?LIVEKIT_URL est requis pour Element Call}
      LIVEKIT_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY est requis pour Element Call}
      LIVEKIT_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET est requis pour Element Call}
    networks:
      - matrix-net
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.lk-jwt.rule=Host(`${MATRIX_DOMAIN}`) && PathPrefix(`/livekit/jwt`)"
      - "traefik.http.routers.lk-jwt.entrypoints=websecure"
      - "traefik.http.routers.lk-jwt.tls=true"
      - "traefik.http.routers.lk-jwt.tls.certresolver=le"
      - "traefik.http.middlewares.lk-jwt-strip.stripprefix.prefixes=/livekit/jwt"
      - "traefik.http.routers.lk-jwt.middlewares=lk-jwt-strip"
      - "traefik.http.services.lk-jwt.loadbalancer.server.port=8080"
networks:
  matrix-net:
    driver: bridge
  proxy:
    external: true
    name: proxy
